<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>16-Bit Endless Runner</title>
    <style>
        /* Pixel UI font (referenced as "Press Start 2P" throughout the game). */
        @font-face {
            font-family: 'Press Start 2P';
            src: url('./fonts/PressStart2P-Regular.ttf') format('truetype');
            font-display: block;
        }

        @font-face {
            font-family: 'AnnStone';
            src: url('./fonts/AnnStone.ttf') format('truetype');
            font-display: block;
        }

        html,
        body {
            margin: 0;
            width: 100%;
            height: 100%;
            background-color: #000000;
            overflow: hidden;
        }

        #game-container {
            width: 100%;
            height: 100%;
        }

        /* Phaser sizes/centers the canvas itself via Scale.FIT + CENTER_BOTH */
        canvas {
            display: block;
            image-rendering: pixelated;
        }
    </style>
    <script src="//cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
</head>

<body>
    <div id="game-container"></div>
    <script src="./data/SaveManager.js"></script>
    <script src="./data/Lore.js"></script>
    <script src="./data/Credits.js"></script>
    <script src="./data/BossLayout.js"></script>
    <script src="./data/BossFight.js"></script>
    <script src="./managers/BackgroundManager.js"></script>
    <script src="./managers/PlayerManager.js"></script>
    <script src="./managers/ObstacleManager.js"></script>
    <script src="./managers/LevelManager.js"></script>
    <script src="./managers/UIManager.js"></script>
    <script src="./managers/CoinManager.js"></script>
    <script src="./managers/FinishLineManager.js"></script>
    <script src="./managers/BossManager.js"></script>
    <script src="./scenes/MenuScene.js"></script>
    <script src="./scenes/GameScene.js"></script>
    <script src="./scenes/DebugScene.js"></script>
    <script src="./src/main.js"></script>
</body>

</html>
